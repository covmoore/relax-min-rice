# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = ProFont IIx Nerd Font Mono

$GREETING_COLOR= rgb(c6ac8f)
$INPUT_BORDER_COLOR= rgb(c6ac8f)
$FAILED_INPUT_BORDER_COLOR= rgb(9b1515)
$TIME_COLOR= rgb(5e503f)
$DATE_COLOR= rgb(104a65)
$GREETING_MESSAGE= GOING FOR A LITTLE NAP...

general {
    hide_cursor = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 1, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = $INPUT_BORDER_COLOR
    check_color = $INPUT_BORDER_COLOR
    fail_color = $FAILED_INPUT_BORDER_COLOR

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = Password Incorrect.

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3
    dots_color = rgba(0, 242, 222, 1) 

    # uncomment to use an input indicator that does not show the password length (similar to swaylock's input indicator)
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    color = $TIME_COLOR
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    color = $DATE_COLOR
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

# ENTER THE SIMULATION
label {
    monitor = 
    text = $GREETING_MESSAGE
    font_size = 60
    font_family = $font
    color = $GREETING_COLOR
    position = 0, 80
    halgin = center
    valign = center
}
